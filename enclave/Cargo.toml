[package]
name = "payband-enclave"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic salary-band aggregation, run in OutLayer's TEE"

[[bin]]
name = "payband-enclave"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
